name: Go material CLI and MCP
on:
  push:
    branches: [main, feat/go-material-mcp-foundation]
    paths: ['go/**', '.github/workflows/go-foundation.yml']
  pull_request:
    paths: ['go/**', '.github/workflows/go-foundation.yml']
jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go/go.mod
      - name: gofmt
        run: test -z "$(gofmt -l go)"
      - name: Go tests
        working-directory: go
        run: go test -race ./...
      - name: Build CLI
        working-directory: go
        run: go build ./cmd/materialmaker-mcp
